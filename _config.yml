# Site settings
title: "TechoFreak"
description: "Exploring the Future of Technology - AI, Software Development, and Innovation"
baseurl: ""  # Leave empty if deploying to the root domain
url: "https://techofreak-org.github.io"

# Theme selection
theme: jekyll-theme-minimal  # Change to any supported theme
# OR use a custom theme
# remote_theme: THEME-NAME

# Plugins (Optional)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Social Links (Optional)
twitter_username: your_twitter
github_username: techofreak-org
facebook_username: techofreak

# Markdown settings
markdown: kramdown
highlighter: rouge  # Syntax highlighting for code

# Exclude these files from build
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

# Customization (Optional)
show_downloads: true  # Show "Download" links in navigation

# Google Analytics (Optional)
google_analytics: UA-XXXXXXXXX-X  # Replace with your tracking ID